[project]
name = "rarest-blue"
version = "1.0.0"
description = "Rarest Blue backend: daily UofT trivia scored by rarity."
requires-python = ">=3.13"
# Exact pins (and their transitive deps, with hashes) live in requirements.lock, which the image installs.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "E501"]
